server:
  port: 8090
spring:
  application:
    name: ir-backend
  datasource:
    url: jdbc:h2:file:./data/ir;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
ir:
  auth:
    secret: ${IR_AUTH_SECRET:}
    token-ttl: ${IR_TOKEN_TTL:12h}
    admin-password: ${IR_ADMIN_PASSWORD:admin123}
  cors:
    origins: ${IR_CORS_ORIGINS:http://localhost:5174}
  sync:
    enabled: ${IR_SYNC_ENABLED:true}
  integration:
    allow-private-hosts: ${IR_ALLOW_PRIVATE_HOSTS:true}
  cost:
    handling-per-order: ${IR_COST_HANDLING_PER_ORDER:1.5}
    packaging-per-order: ${IR_COST_PACKAGING_PER_ORDER:0.8}
  balance:
    mode: ${IR_BALANCE_MODE:AUTO}
    schedule-enabled: ${IR_BALANCE_SCHEDULE:true}
    cron: ${IR_BALANCE_CRON:0 10/30 * * * ?}
    max-decisions-per-run: ${IR_BALANCE_MAX_DECISIONS:20}
    max-auto-execute-per-run: ${IR_BALANCE_MAX_AUTO:10}
    auto-purchase-amount-limit: ${IR_BALANCE_PURCHASE_LIMIT:20000}
    cooldown-hours: ${IR_BALANCE_COOLDOWN_HOURS:24}
    service-guard-attainment: ${IR_BALANCE_SERVICE_GUARD:0.9}
